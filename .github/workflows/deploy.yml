name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Change this to the branch you want to deploy from (e.g., main or master)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x' # Use the Node.js version specified in your package.json or a compatible one

      - name: Install dependencies
        run: npm install

      - name: Build Docusaurus website
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build # Docusaurus builds to the 'build' directory by default
          publish_branch: gh-pages # The branch where the static site will be deployed
